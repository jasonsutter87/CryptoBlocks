<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>
  {{ block "title" . }}
    {{ if .Params.PageTitle }}{{ .Params.PageTitle }}
    {{ else if .Title }}{{ .Title }} | {{ .Site.Title }}
    {{ else }}{{ .Site.Title }}
    {{ end }}
  {{ end }}
</title>

{{ partial "seo_schema" . }}

<link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}" sizes="180x180">
<link rel="icon" href="{{ "favicon-32x32.png" | relURL }}" sizes="32x32" type="image/png">
<link rel="icon" href="{{ "favicon-16x16.png" | relURL }}" sizes="16x16" type="image/png">
<link rel="icon" href="{{ "favicon.ico" | relURL }}">
<meta name="theme-color" content="#1e1e2e">

{{ if not .Params.canonical }}
  <link rel="canonical" href="{{ .Permalink }}">
{{ end }}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ "css/theme.css" | relURL }}">
{{ range .Params.css }}
  <link rel="stylesheet" href="{{ "css/pages/" | relURL }}{{ . }}">
{{ end }}

<script src="{{ "js/theme.js" | relURL }}"></script>
