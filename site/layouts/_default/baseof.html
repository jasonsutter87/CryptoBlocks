<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en-us" }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body class="min-h-screen flex flex-col bg-white text-gray-800 font-sans">
    {{/* Skip link for keyboard users */}}
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:bg-primary focus:text-white focus:px-4 focus:py-2 focus:rounded-lg focus:shadow-lg focus:outline-none focus:ring-2 focus:ring-accent">
      Skip to main content
    </a>

    <header class="bg-white border-b border-gray-200">
      {{ partial "header.html" . }}
    </header>

    <main id="main-content" class="flex-grow" tabindex="-1">
      {{ block "main" . }}{{ end }}
    </main>

    <footer class="bg-gray-50 border-t border-gray-200">
      {{ partial "footer.html" . }}
    </footer>

    {{ partial "foot.html" . }}
  </body>
</html>
