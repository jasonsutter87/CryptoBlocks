[build]
  publish = "public"
  command = "npm run build"

[context.production.environment]
  HUGO_VERSION = "0.147.4"
  NODE_VERSION = "20"

[[redirects]]
  from = "/app"
  to = "https://app.getcryptoblocks.com"
  status = 301

[[redirects]]
  from = "/app/*"
  to = "https://app.getcryptoblocks.com/:splat"
  status = 301

# /chat — the CryptoBlocks "brain": a from-scratch micro-model that only
# knows CryptoBlocks, served (password-gated) from the homelab via Tailscale
# Funnel. status=200 = a proxy/rewrite, so the URL stays getcryptoblocks.com/chat
# while the bytes come from the brain. The exact-path rule serves the page;
# the wildcard strips /chat so the brain's /meta /ask /corpus endpoints resolve.
# NOTE: temporarily served from jasons-macbook-pro (laptop) while jason-server
# SSH access is being restored. Revert origin to jason-server once migrated.
[[redirects]]
  from = "/chat"
  to = "https://jasons-macbook-pro.taildf1d89.ts.net:8443/chat"
  status = 200
  force = true

[[redirects]]
  from = "/chat/*"
  to = "https://jasons-macbook-pro.taildf1d89.ts.net:8443/:splat"
  status = 200
  force = true
