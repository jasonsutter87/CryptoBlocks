[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Explicit Permissions-Policy so Chrome/Edge allow Web Bluetooth, USB, and
# Serial from the top-level document. Needed for the micro:bit hardware
# blocks. Brave Shields may still block these independently — tell users
# to drop shields for this site.
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "bluetooth=*, usb=*, serial=*, camera=*, microphone=*"

# Route /api/projects to the Netlify Function (must come before SPA catch-all)
[[redirects]]
  from = "/api/projects"
  to = "/.netlify/functions/projects"
  status = 200

[[redirects]]
  from = "/api/projects/*"
  to = "/.netlify/functions/projects/:splat"
  status = 200

# SPA — all other routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
