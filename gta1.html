<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GTA1-style Sandbox — top-down reference</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      background: #14131a;
      color: #ddd;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh;
    }
    h1 { margin: 14px 0 4px; font-size: 16px; letter-spacing: .5px; opacity: .9; }
    canvas { image-rendering: pixelated; border: 2px solid #333; border-radius: 6px; background: #1a1f1c; }
    .hud { margin-top: 8px; font-size: 11px; opacity: .7; }
    .hud b { color: #ffd76a; }
  </style>
</head>
<body>
  <h1>Top-down sandbox — GTA1 reference</h1>
  <canvas id="game" width="800" height="600"></canvas>
  <div class="hud">
    <b>WASD</b> walk &nbsp;·&nbsp; <b>↑↓←→</b> drive &nbsp;·&nbsp;
    <b>E</b> enter/exit car &nbsp;·&nbsp; <b>R</b> restart
  </div>

  <script>
  // ─────────────────────────────────────────────────────────────────────────
  // Top-down sandbox in the spirit of GTA1.
  //
  // Single 80×60 tile city, scrolling camera follows player or player's car.
  // Map is generated by carving a grid of streets through a sea of buildings.
  // Player walks on foot or drives a car (E to enter/exit). Pedestrians
  // wander on sidewalks. Hit a ped → wanted level rises → cops spawn and
  // chase. Same engine shape as Mario / Pac-Man so this ports to blocks
  // cleanly later.
  // ─────────────────────────────────────────────────────────────────────────

  // ─── Constants ───────────────────────────────────────────────────────────
  const TILE = 24;
  const VIEW_W = 800;
  const VIEW_H = 600;

  const WALK_SPEED   = 2.4;   // px/frame on foot
  const CAR_ACCEL    = 0.14;
  const CAR_BRAKE    = 0.22;
  const CAR_FRICTION = 0.97;
  const CAR_MAX_SPD  = 6.5;
  const CAR_TURN     = 0.05;  // rad/frame — scaled by speed
  const PED_SPEED    = 0.9;
  const COP_SPEED    = 2.6;

  // Tile glyphs
  // ' ' road    '.' sidewalk    'B' building    'G' grass    'W' water
  const TILE_COLOR = {
    ' ': '#34343a',  // asphalt
    '.': '#7a7a82',  // sidewalk
    'B': null,       // drawn as decorated building
    'G': '#3a7a3a',
    'W': '#1a4a78',
  };

  // ─── Map generation ──────────────────────────────────────────────────────
  const MAP_W = 80;
  const MAP_H = 60;

  function makeCity() {
    // start with all buildings, then carve roads + sidewalks
    const grid = Array.from({ length: MAP_H }, () => new Array(MAP_W).fill('B'));

    const HSTREETS = [6, 18, 30, 42, 54];        // horizontal road rows
    const VSTREETS = [6, 20, 36, 52, 68];        // vertical road cols

    // 3-tile wide horizontal roads with 1-tile sidewalks each side
    for (const r of HSTREETS) {
      for (let x = 0; x < MAP_W; x++) {
        grid[r - 1][x] = '.';
        grid[r    ][x] = ' ';
        grid[r + 1][x] = '.';
      }
    }
    // 3-tile wide vertical roads
    for (const c of VSTREETS) {
      for (let y = 0; y < MAP_H; y++) {
        grid[y][c - 1] = '.';
        grid[y][c    ] = ' ';
        grid[y][c + 1] = '.';
      }
    }
    // Park (grass) — replaces a city block
    for (let y = 21; y <= 27; y++)
      for (let x = 23; x <= 33; x++)
        grid[y][x] = 'G';

    // Water on the right edge
    for (let y = 0; y < MAP_H; y++)
      for (let x = 75; x < MAP_W; x++)
        grid[y][x] = 'W';

    // Building visual variants — vary by hash so adjacent buildings look different
    // (we store the color seed in a parallel map; the glyph stays 'B')
    return grid;
  }

  function buildingShade(x, y) {
    // deterministic but varied
    const h = (x * 73856093 ^ y * 19349663) >>> 0;
    const v = (h % 7);
    const palette = ['#5e3a30', '#4a4a52', '#6a4d2c', '#3a3a44', '#5c4060', '#3e2c2c', '#3d4d3a'];
    return palette[v];
  }

  function tileAt(grid, x, y) {
    if (y < 0 || y >= MAP_H || x < 0 || x >= MAP_W) return 'B';
    return grid[y][x];
  }

  function isWalkable(t) { return t !== 'B' && t !== 'W'; }
  function isDriveable(t) { return t === ' ' || t === '.' || t === 'G'; }   // sidewalk/grass slow but driveable

  // ─── State ───────────────────────────────────────────────────────────────
  let state;

  function makeState() {
    const grid = makeCity();

    const player = { x: 7 * TILE, y: 8 * TILE, angle: 0, w: 14, h: 14, alive: true, inCar: null };

    // place a few cars on the streets, pointed along their road
    const cars = [
      newCar(10 * TILE, 6 * TILE,  0,            '#cc2222'),  // top-left, facing east
      newCar(40 * TILE, 30 * TILE, Math.PI / 2,  '#22aa22'),  // central, facing south
      newCar(36 * TILE, 18 * TILE, Math.PI,      '#dddd44'),  // facing west
      newCar(20 * TILE, 42 * TILE, 0,            '#7755cc'),
      newCar(52 * TILE, 54 * TILE, -Math.PI / 2, '#ee8822'),
    ];
    // pedestrians scattered on sidewalks
    const peds = [];
    let placed = 0, tries = 0;
    while (placed < 14 && tries++ < 400) {
      const x = Math.floor(Math.random() * MAP_W);
      const y = Math.floor(Math.random() * MAP_H);
      if (grid[y][x] !== '.') continue;
      peds.push(newPed(x * TILE + TILE / 2, y * TILE + TILE / 2));
      placed++;
    }

    return {
      grid,
      player,
      cars,
      peds,
      cops: [],
      camera: { x: 0, y: 0 },
      wanted: 0,
      wantedDecay: 0,
      score: 0,
      gameOver: false,
      keys: {},
    };
  }

  function newCar(x, y, angle, color) {
    return { kind: 'car', x, y, angle, vx: 0, vy: 0, speed: 0, w: 36, h: 18, color, driver: null, wrecked: false };
  }
  function newPed(x, y) {
    const palette = ['#dba88a', '#a87a52', '#5c5c5c', '#cccccc', '#8a4a4a', '#4a8a4a'];
    return { kind: 'ped', x, y, angle: Math.random() * Math.PI * 2, w: 12, h: 12,
             color: palette[Math.floor(Math.random() * palette.length)],
             walkTimer: Math.random() * 60, alive: true };
  }
  function newCop(x, y) {
    return { kind: 'cop', x, y, angle: 0, w: 12, h: 12, alive: true };
  }

  // ─── Input ───────────────────────────────────────────────────────────────
  const KEYS = {};
  window.addEventListener('keydown', (e) => {
    KEYS[e.code] = true;
    if (e.code === 'KeyR') state = makeState();
    if (e.code === 'KeyE') toggleVehicle();
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','Space'].includes(e.code)) e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { KEYS[e.code] = false; });

  function toggleVehicle() {
    if (!state.player.inCar) {
      // find nearby car
      let nearest = null, dmin = 40 * 40;
      for (const c of state.cars) {
        if (c.wrecked) continue;
        const dx = c.x - state.player.x, dy = c.y - state.player.y;
        const d = dx * dx + dy * dy;
        if (d < dmin) { dmin = d; nearest = c; }
      }
      if (nearest) {
        const wasOwned = nearest.driver !== null;
        state.player.inCar = nearest;
        nearest.driver = 'player';
        // Stealing a parked car is a crime if it had no driver — small bump
        if (!wasOwned) state.wanted = Math.min(4, state.wanted + 1);
      }
    } else {
      const car = state.player.inCar;
      car.driver = null;
      // step out beside the car
      state.player.x = car.x + Math.cos(car.angle + Math.PI / 2) * 18;
      state.player.y = car.y + Math.sin(car.angle + Math.PI / 2) * 18;
      state.player.inCar = null;
    }
  }

  // ─── Helpers ─────────────────────────────────────────────────────────────
  function tileAtPx(grid, px, py) {
    return tileAt(grid, Math.floor(px / TILE), Math.floor(py / TILE));
  }
  function dist2(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; }

  // Resolve movement of a circle-ish entity by axis. Tile-grid AABB.
  function moveSlide(grid, entity, dx, dy, canEnter) {
    entity.x += dx;
    if (dx !== 0) {
      const r = entity.w / 2;
      const probes = [{ x: entity.x + (dx > 0 ? r : -r), y: entity.y - r + 1 },
                      { x: entity.x + (dx > 0 ? r : -r), y: entity.y + r - 1 }];
      for (const p of probes) {
        if (canEnter(tileAtPx(grid, p.x, p.y))) continue;
        if (dx > 0) entity.x = Math.floor(p.x / TILE) * TILE - r;
        else        entity.x = Math.floor(p.x / TILE + 1) * TILE + r;
        break;
      }
    }
    entity.y += dy;
    if (dy !== 0) {
      const r = entity.w / 2;
      const probes = [{ x: entity.x - r + 1, y: entity.y + (dy > 0 ? r : -r) },
                      { x: entity.x + r - 1, y: entity.y + (dy > 0 ? r : -r) }];
      for (const p of probes) {
        if (canEnter(tileAtPx(grid, p.x, p.y))) continue;
        if (dy > 0) entity.y = Math.floor(p.y / TILE) * TILE - r;
        else        entity.y = Math.floor(p.y / TILE + 1) * TILE + r;
        break;
      }
    }
  }

  // ─── Update ──────────────────────────────────────────────────────────────
  function update() {
    if (state.gameOver) return;
    const { grid, player, cars, peds, cops } = state;

    // Wanted decay (1 level every 8 seconds when not adding crime)
    state.wantedDecay++;
    if (state.wanted > 0 && state.wantedDecay > 60 * 8) {
      state.wanted--;
      state.wantedDecay = 0;
    }

    // ── Player movement ──
    if (player.inCar) {
      const car = player.inCar;
      const fwd = (KEYS.ArrowUp    || KEYS.KeyW) ? 1 : 0;
      const bwd = (KEYS.ArrowDown  || KEYS.KeyS) ? 1 : 0;
      const lt  = (KEYS.ArrowLeft  || KEYS.KeyA) ? 1 : 0;
      const rt  = (KEYS.ArrowRight || KEYS.KeyD) ? 1 : 0;
      car.speed += fwd * CAR_ACCEL;
      car.speed -= bwd * CAR_BRAKE;
      car.speed *= CAR_FRICTION;
      car.speed = Math.max(-CAR_MAX_SPD * 0.5, Math.min(CAR_MAX_SPD, car.speed));
      // Turn rate scales with speed magnitude (no spinning in place)
      const turnRate = CAR_TURN * Math.min(1, Math.abs(car.speed) / 1.5);
      car.angle += (rt - lt) * turnRate * Math.sign(car.speed || 1);

      const vx = Math.cos(car.angle) * car.speed;
      const vy = Math.sin(car.angle) * car.speed;
      // Sidewalk/grass slow the car
      const t = tileAtPx(grid, car.x, car.y);
      const slow = (t === '.' || t === 'G') ? 0.7 : 1;
      moveSlide(grid, car, vx * slow, vy * slow, isDriveable);
      // Player follows the car
      player.x = car.x;
      player.y = car.y;
      player.angle = car.angle;

      // Run over peds
      for (const p of peds) {
        if (!p.alive) continue;
        if (dist2(p, car) < 18 * 18 && Math.abs(car.speed) > 1.5) {
          p.alive = false;
          state.score += 50;
          state.wanted = Math.min(5, state.wanted + 1);
          state.wantedDecay = 0;
        }
      }
    } else {
      // On foot — 8-direction movement
      let dx = 0, dy = 0;
      if (KEYS.KeyW || KEYS.ArrowUp)    dy -= 1;
      if (KEYS.KeyS || KEYS.ArrowDown)  dy += 1;
      if (KEYS.KeyA || KEYS.ArrowLeft)  dx -= 1;
      if (KEYS.KeyD || KEYS.ArrowRight) dx += 1;
      if (dx || dy) {
        const len = Math.hypot(dx, dy);
        dx /= len; dy /= len;
        player.angle = Math.atan2(dy, dx);
        moveSlide(grid, player, dx * WALK_SPEED, dy * WALK_SPEED, isWalkable);
      }
    }

    // ── Pedestrians ──
    for (const p of peds) {
      if (!p.alive) continue;
      p.walkTimer--;
      if (p.walkTimer <= 0) {
        p.angle = Math.random() * Math.PI * 2;
        p.walkTimer = 60 + Math.floor(Math.random() * 120);
      }
      const dx = Math.cos(p.angle) * PED_SPEED;
      const dy = Math.sin(p.angle) * PED_SPEED;
      const before = { x: p.x, y: p.y };
      moveSlide(grid, p, dx, dy, isWalkable);
      // If pedestrian got stuck, reverse next time
      if (Math.abs(p.x - before.x) < 0.1 && Math.abs(p.y - before.y) < 0.1) {
        p.angle += Math.PI;
      }
    }

    // ── Spawn cops based on wanted level ──
    if (state.wanted > 0 && cops.length < state.wanted * 2) {
      // spawn one off-screen
      const camCx = state.camera.x + VIEW_W / 2;
      const camCy = state.camera.y + VIEW_H / 2;
      const ang = Math.random() * Math.PI * 2;
      const dist = VIEW_W * 0.7;
      const sx = camCx + Math.cos(ang) * dist;
      const sy = camCy + Math.sin(ang) * dist;
      // clamp inside map
      const cx = Math.max(2 * TILE, Math.min((MAP_W - 2) * TILE, sx));
      const cy = Math.max(2 * TILE, Math.min((MAP_H - 2) * TILE, sy));
      cops.push(newCop(cx, cy));
    }

    // ── Cops chase player ──
    for (const c of cops) {
      if (!c.alive) continue;
      const dx = player.x - c.x;
      const dy = player.y - c.y;
      const d = Math.hypot(dx, dy) || 1;
      c.angle = Math.atan2(dy, dx);
      moveSlide(grid, c, (dx / d) * COP_SPEED, (dy / d) * COP_SPEED, isWalkable);
      // Close enough to bust
      if (d < 16 && !player.inCar) {
        state.gameOver = true;
      }
    }

    // ── Camera follows player ──
    const targetX = player.x - VIEW_W / 2;
    const targetY = player.y - VIEW_H / 2;
    state.camera.x = Math.max(0, Math.min(MAP_W * TILE - VIEW_W, targetX));
    state.camera.y = Math.max(0, Math.min(MAP_H * TILE - VIEW_H, targetY));
  }

  // ─── Render ──────────────────────────────────────────────────────────────
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  function drawTile(x, y, glyph, screenX, screenY) {
    if (glyph === 'B') {
      // Building — varied color + window grid
      ctx.fillStyle = buildingShade(x, y);
      ctx.fillRect(screenX, screenY, TILE, TILE);
      // dark border between buildings
      ctx.fillStyle = '#1a1a22';
      ctx.fillRect(screenX, screenY, 1, TILE);
      ctx.fillRect(screenX, screenY, TILE, 1);
      // simple window pattern
      ctx.fillStyle = 'rgba(255,255,200,0.18)';
      ctx.fillRect(screenX + 5, screenY + 5, 4, 4);
      ctx.fillRect(screenX + 15, screenY + 5, 4, 4);
      ctx.fillRect(screenX + 5, screenY + 15, 4, 4);
      ctx.fillRect(screenX + 15, screenY + 15, 4, 4);
      return;
    }
    const fill = TILE_COLOR[glyph];
    if (fill) { ctx.fillStyle = fill; ctx.fillRect(screenX, screenY, TILE, TILE); }
    if (glyph === ' ') {
      // road dashes when this tile is the center of a horizontal/vertical road
      const left = tileAt(state.grid, x - 1, y);
      const right = tileAt(state.grid, x + 1, y);
      const up = tileAt(state.grid, x, y - 1);
      const down = tileAt(state.grid, x, y + 1);
      ctx.fillStyle = '#e0c95a';
      if (left === ' ' && right === ' ') {
        // horizontal road — yellow dashes along middle
        if ((x % 2) === 0) ctx.fillRect(screenX + 6, screenY + TILE / 2 - 1, TILE - 12, 2);
      }
      if (up === ' ' && down === ' ') {
        // vertical road — yellow dashes
        if ((y % 2) === 0) ctx.fillRect(screenX + TILE / 2 - 1, screenY + 6, 2, TILE - 12);
      }
    } else if (glyph === '.') {
      // subtle sidewalk grout
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.fillRect(screenX, screenY + TILE / 2, TILE, 1);
      ctx.fillRect(screenX + TILE / 2, screenY, 1, TILE);
    } else if (glyph === 'G') {
      // tufts of grass
      ctx.fillStyle = '#4a9a4a';
      ctx.fillRect(screenX + 3,  screenY + 5,  2, 2);
      ctx.fillRect(screenX + 12, screenY + 14, 2, 2);
      ctx.fillRect(screenX + 19, screenY + 8,  2, 2);
    } else if (glyph === 'W') {
      // water shimmer
      ctx.fillStyle = 'rgba(255,255,255,0.07)';
      ctx.fillRect(screenX + ((x + y) % 3) * 5 + 2, screenY + 4, 8, 1);
    }
  }

  function drawCar(c, sx, sy) {
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(c.angle);
    // body
    ctx.fillStyle = c.wrecked ? '#444' : c.color;
    ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
    // outline
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(-c.w / 2, -c.h / 2, c.w, 1);
    ctx.fillRect(-c.w / 2,  c.h / 2 - 1, c.w, 1);
    // windshield (front third)
    ctx.fillStyle = '#a0d0ff';
    ctx.fillRect(c.w / 2 - 12, -c.h / 2 + 3, 6, c.h - 6);
    // wheels
    ctx.fillStyle = '#111';
    ctx.fillRect(-c.w / 2 + 2,  -c.h / 2 - 2, 6, 3);
    ctx.fillRect(-c.w / 2 + 2,   c.h / 2 - 1, 6, 3);
    ctx.fillRect( c.w / 2 - 8,  -c.h / 2 - 2, 6, 3);
    ctx.fillRect( c.w / 2 - 8,   c.h / 2 - 1, 6, 3);
    ctx.restore();
  }

  function drawPed(p, sx, sy, color, isCop = false) {
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(p.angle);
    // body
    ctx.fillStyle = isCop ? '#1a3a8a' : color;
    ctx.fillRect(-5, -4, 10, 8);
    // head
    ctx.fillStyle = '#dba88a';
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
    // forward marker (so you can see facing)
    ctx.fillStyle = isCop ? '#fff' : '#222';
    ctx.fillRect(3, -1, 3, 2);
    ctx.restore();
  }

  function drawPlayer(p, sx, sy) {
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(p.angle);
    ctx.fillStyle = '#e83a3a';
    ctx.fillRect(-6, -5, 12, 10);
    ctx.fillStyle = '#fac090';
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
    // forward marker
    ctx.fillStyle = '#fff';
    ctx.fillRect(4, -1, 3, 2);
    ctx.restore();
  }

  function render() {
    const camX = Math.floor(state.camera.x);
    const camY = Math.floor(state.camera.y);
    ctx.fillStyle = '#0a0a14';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    // Tiles in viewport
    const startCol = Math.max(0, Math.floor(camX / TILE));
    const startRow = Math.max(0, Math.floor(camY / TILE));
    const endCol   = Math.min(MAP_W, Math.ceil((camX + VIEW_W) / TILE) + 1);
    const endRow   = Math.min(MAP_H, Math.ceil((camY + VIEW_H) / TILE) + 1);
    for (let y = startRow; y < endRow; y++)
      for (let x = startCol; x < endCol; x++)
        drawTile(x, y, state.grid[y][x], x * TILE - camX, y * TILE - camY);

    // Cars
    for (const c of state.cars) drawCar(c, c.x - camX, c.y - camY);

    // Peds
    for (const p of state.peds) {
      if (!p.alive) {
        // splat
        ctx.fillStyle = 'rgba(160,0,20,0.6)';
        ctx.beginPath();
        ctx.arc(p.x - camX, p.y - camY, 8, 0, Math.PI * 2);
        ctx.fill();
        continue;
      }
      drawPed(p, p.x - camX, p.y - camY, p.color);
    }

    // Cops
    for (const c of state.cops) drawPed(c, c.x - camX, c.y - camY, null, true);

    // Player (only if on foot — in car, drawCar already represents them)
    if (!state.player.inCar) drawPlayer(state.player, state.player.x - camX, state.player.y - camY);

    // ── HUD ──
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SCORE ' + String(state.score).padStart(5, '0'), 10, 22);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#ffd76a';
    ctx.fillText('WANTED  ', VIEW_W - 110, 22);
    for (let i = 0; i < 5; i++) {
      ctx.fillStyle = i < state.wanted ? '#ff5c5c' : '#3a3a44';
      ctx.fillText('★', VIEW_W - 88 + i * 18, 22);
    }
    ctx.fillStyle = '#888';
    ctx.textAlign = 'left';
    ctx.font = '11px monospace';
    ctx.fillText(state.player.inCar ? 'driving — E to exit' : 'on foot — E near a car to enter', 10, VIEW_H - 10);

    // Mini-map (top-right)
    const mmW = 120, mmH = 90;
    const mmX = VIEW_W - mmW - 10;
    const mmY = 32;
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(mmX - 2, mmY - 2, mmW + 4, mmH + 4);
    for (let y = 0; y < MAP_H; y++) {
      for (let x = 0; x < MAP_W; x++) {
        const t = state.grid[y][x];
        ctx.fillStyle =
          t === ' ' ? '#888' :
          t === '.' ? '#666' :
          t === 'G' ? '#3a7a3a' :
          t === 'W' ? '#1a4a78' :
          '#222';
        ctx.fillRect(mmX + Math.floor(x * mmW / MAP_W), mmY + Math.floor(y * mmH / MAP_H), 2, 2);
      }
    }
    // player marker on minimap
    ctx.fillStyle = '#ff5c5c';
    ctx.fillRect(
      mmX + Math.floor(state.player.x / TILE * mmW / MAP_W) - 1,
      mmY + Math.floor(state.player.y / TILE * mmH / MAP_H) - 1, 3, 3);

    // Game over overlay
    if (state.gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      ctx.fillStyle = '#ff5c5c';
      ctx.font = 'bold 36px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('BUSTED', VIEW_W / 2, VIEW_H / 2 - 8);
      ctx.fillStyle = '#fff';
      ctx.font = '14px monospace';
      ctx.fillText('Final score: ' + state.score, VIEW_W / 2, VIEW_H / 2 + 22);
      ctx.fillText('press R to restart', VIEW_W / 2, VIEW_H / 2 + 46);
      ctx.textAlign = 'left';
    }
  }

  // ─── Boot ────────────────────────────────────────────────────────────────
  state = makeState();
  (function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
